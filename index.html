<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For You 🤍</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin:0; padding:0; }
body {
    
  font-family: 'Poppins', sans-serif;
  color:#fff;
  background: linear-gradient(135deg,#ff9a9e,#fad0c4,#a18cd1,#fbc2eb);
  background-size: 400% 400%;
  animation: gradientShift 15s ease infinite;
  overflow-y: auto;
  overflow-x: hidden;
  scroll-behavior: smooth;
  min-height: 100vh;
}
@keyframes gradientShift {0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}

.screen { display: none; width: 100%; justify-content: center; align-items: center; text-align: center; }
.screen.active { display: flex; flex-direction: column; }

.gift-box { font-size: 90px; cursor: pointer; animation: float 2s ease-in-out infinite; }
.challenge, .card { background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); border-radius: 22px; padding: 28px 22px 32px; margin: 30px auto; max-width: 380px; box-shadow: 0 30px 80px rgba(0,0,0,0.45); text-align: center; }
.challenge h2, .card h1 { font-family: 'Playfair Display', serif; color: #ffd6e8; margin-bottom: 10px; }
.challenge input { margin-top:12px; padding:10px; width:100%; border-radius:12px; border:none; text-align:center; font-size:14px; }
.challenge button { margin-top:12px; padding:10px 20px; border:none; border-radius:20px; background:#ffd6e8; color:#333; cursor:pointer; }
.error { margin-top:8px; font-size:13px; color:#ffb3c6; display:none; }

.card h1 { font-size:28px; }
.name { font-family:'Playfair Display', serif; font-size:24px; font-weight:600; margin-bottom:18px; }
.divider { width:60px; height:2px; background:linear-gradient(90deg,transparent,#ffd6e8,transparent); margin:18px auto; }

.photos { display:flex; gap:14px; overflow-x:auto; padding-bottom:10px; scroll-behavior:smooth; margin-bottom:20px; }
.photo-item { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; min-width:90px; transition: transform 0.3s; }
.photo-item img { width:90px; height:120px; object-fit:cover; border-radius:14px; cursor:pointer; transition: transform 0.3s; }

.heart{font-size:26px;margin-top:10px;animation:beat 1.4s infinite;}
audio{margin-top:20px;width:100%;}
.footer{font-size:13px;margin-top:18px;opacity:0.85;}

.love-container{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;pointer-events:none;z-index:9999;}
.love{font-size:40px;position:absolute;animation:floatLove 2s ease forwards;opacity:0;}

/* Smooth scroll di body */
html {
  scroll-behavior: smooth;
}

/* Optimalisasi animasi floating */
.photo-item img {
  will-change: transform;
  animation: floatPhoto 5s ease-in-out infinite;
}

/* Float ringan, tanpa shadow berat */
.card {
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  backdrop-filter: blur(6px); /* blur dikurangi */
}

/* Hapus fixed particles untuk HP, atau pakai canvas ringan */
@media (max-width:768px){
  .particles, .love-container, .confetti { display:none; }
}

@keyframes beat{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
@keyframes floatLove{0%{transform:translateY(0) scale(0.5);opacity:1;}100%{transform:translateY(-200px) scale(1.5);opacity:0;}}
</style>
</head>
<body>

<!-- Gift screen -->
<div class="screen active" id="gift">
  <div onclick="goChallenge()">
    <div class="gift-box">🎁</div>
    <p>Tap kadonya dulu ya…</p>
  </div>
</div>

<!-- Challenge screen -->
<div class="screen" id="challenge">
  <div class="challenge">
    <h2>Tantangan kecil 🤍</h2>
    <p>Masukin tanggal lahir kamu dulu ya (DD/MM/YYYY)</p>
    <input type="text" id="code" placeholder="contoh: 12/34/5678">
    <button onclick="checkCode()">Masuk</button>
    <div class="error" id="error">Hehe, salah 🤍 coba lagi ya</div>
  </div>
</div>

<!-- Main screen scrollable -->
<div class="screen" id="main">
  <div class="card" data-speed="0.5">
    <h1>Happy Birthday 🎂</h1>
    <div class="name">[Rizqita Mumtaz]</div>
    <div class="divider"></div>

    <div class="photos">
      <div class="photo-item"><img src="foto1.jpeg"><div class="caption">wih anak gunung banget nih</div></div>
      <div class="photo-item"><img src="foto2.jpeg"><div class="caption">eh ada teteh cantik</div></div>
      <div class="photo-item"><img src="foto3.jpeg"><div class="caption">siap teteh OSIS wkwk</div></div>
    </div>

    <p id="typing"></p>
    <div class="heart">🤍</div>

    <audio controls autoplay loop>
        <source src="aboutyou.MP3" type="audio/mpeg">
      </audio>
  

    <div class="footer">Dari aku, yang selalu mikirin kamu.</div>
  </div>
</div>

<div class="love-container"></div>

<script>
window.onload=function(){
  const photos = [
    { src: 'foto1.jpeg', caption: 'wih anak gunung banget nih' },
    { src: 'foto2.jpeg', caption: 'eh ada teteh cantik' },
    { src: 'foto3.jpeg', caption: 'siap teteh OSIS wkwk' }
  ];
  

  // Photo click overlay
  document.querySelectorAll('.photos img').forEach((img,i)=>{
    img.onclick=()=>openPhoto(i);
  });

  function openPhoto(index){
    const overlay=document.createElement('div');
    overlay.style.position='fixed';
    overlay.style.inset='0';
    overlay.style.background='rgba(0,0,0,0.85)';
    overlay.style.display='flex';
    overlay.style.justifyContent='center';
    overlay.style.alignItems='center';
    overlay.style.flexDirection='column';
    overlay.style.zIndex=9999;

    const bigImg=document.createElement('img');
    bigImg.src=photos[index].src;
    bigImg.style.maxWidth='80%';
    bigImg.style.maxHeight='80%';
    bigImg.style.objectFit='contain';
    bigImg.style.borderRadius='18px';
    overlay.appendChild(bigImg);

    const caption=document.createElement('div');
    caption.textContent=photos[index].caption;
    caption.style.color='#ffd6e8';
    caption.style.marginTop='10px';
    caption.style.fontFamily="'Playfair Display', serif";
    caption.style.fontSize='14px';
    overlay.appendChild(caption);

    overlay.addEventListener('click', e=>{if(e.target===overlay) overlay.remove();});
    document.body.appendChild(overlay);
  }

  window.goChallenge=()=>{document.getElementById('gift').classList.remove('active'); document.getElementById('challenge').classList.add('active');}
  window.checkCode=()=>{
    const code=document.getElementById('code').value.trim();
    if(code==='29/12/2008'){ showLoveAnimation(); } else { document.getElementById('error').style.display='block'; }
  }

  function showLoveAnimation(){
    const container=document.querySelector('.love-container'); container.innerHTML='';
    for(let i=0;i<20;i++){
      const heart=document.createElement('div');
      heart.className='love';
      heart.textContent='❤️';
      heart.style.left=Math.random()*100+'%';
      heart.style.fontSize=(18+Math.random()*12)+'px';
      container.appendChild(heart);
      heart.animate([{transform:'translateY(0) scale(0.5)',opacity:0.8},{transform:'translateY(-150px) scale(1.2)',opacity:1},{transform:'translateY(-300px) scale(1)',opacity:0}],{duration:1500+Math.random()*800,iterations:1,easing:'ease-out'});
      setTimeout(()=>heart.remove(),2000);
    }
    setTimeout(showMainScreen,2000);
  }

  function showMainScreen(){
    document.getElementById('challenge').classList.remove('active');
    document.getElementById('main').classList.add('active');
    const audio=document.getElementById('bgm'); if(audio) audio.play();
    startTyping();
    window.addEventListener('scroll', parallaxEffect);
  }

  // Typing text
  const text="HAII MAKASIH UDAH BUKA KADO NYA, AKU MAU NGUCAPIN.\nSelamat ulang tahun yaa untuk dirimuu 🤍.\nSemoga dengan ini kamu bisa senang dan bahagia.\naku ucapin selamat sekali lagi panjang umur & sehat selalu.\nHappy birthday! 🎉.\nSemoga di umur baru ini semua hal-hal seru dan menyenangkan datang ke hidupmu.\nSemoga selalu sehat, bahagia, dan makin banyak pengalaman keren.\nTerima kasih udah jadi orang yang asik banget buat diajak ngobrol dan mabar.\nSemoga hari ini spesial banget buat kamu, dan semoga kita masih bisa ketemu 😄✨.\nKu ucapkan Terima kasih sudah hadir dalam hidupku.\nAku senang kok ngabisin waktu sama kamu.Aku harap kamu juga seneng.\nTerima kasih banyak buat semuanya, I Hope You Like It✨";
  const typingEl=document.getElementById('typing'); let index=0;
  function startTyping(){ if(!typingEl) return; typingEl.innerHTML=''; index=0; typeEffect(); }
  function typeEffect(){ if(index<text.length){ typingEl.innerHTML+=text[index]==='\n'?'<br>':text[index]; index++; setTimeout(typeEffect,45); } }

  // Parallax effect
  function parallaxEffect(){
    document.querySelectorAll('.card').forEach(card=>{
      const speed=card.dataset.speed || 0.5;
      const y=window.scrollY*speed;
      card.style.transform=`translateY(${y}px)`;
    });
  }
  
}
</script>
</body>
</html>
