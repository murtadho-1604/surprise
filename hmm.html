<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For You 🤍</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
  background-size: 400% 400%;
  animation: gradientShift 15s ease infinite;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
  color: #fff;
  overflow: hidden;
}
@keyframes gradientShift {0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}

.screen { display: none; width: 100%; justify-content: center; align-items: center; text-align: center; }
.screen.active { display: flex; }

.gift-box { font-size: 90px; cursor: pointer; animation: float 2.5s ease-in-out infinite, glow 2s ease-in-out infinite; }
@keyframes glow {0%,100%{text-shadow:0 0 10px #ffd6e8,0 0 30px #fbc2eb,0 0 50px #ff9a9e;}50%{text-shadow:0 0 20px #ff9a9e,0 0 40px #a18cd1,0 0 60px #fbc2eb;}}

.challenge { background: rgba(255,255,255,0.08); padding: 30px 25px; border-radius: 22px; max-width: 380px; width: 90%; animation: fadeIn 1.3s ease; }
.challenge h2 { font-family: 'Playfair Display', serif; color: #ffd6e8; margin-bottom: 10px; }
.challenge p { font-size: 14px; opacity: 0.9; }
.challenge input { margin-top: 12px; padding: 10px; width: 100%; border-radius: 12px; border: none; text-align: center; font-size: 14px; }
.challenge button { margin-top: 12px; padding: 10px 20px; border: none; border-radius: 20px; background: #ffd6e8; color: #333; font-size: 14px; cursor: pointer; }
.error { margin-top: 8px; font-size: 13px; color: #ffb3c6; display: none; }

.card { background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); border-radius: 22px; padding: 28px 22px 32px; box-shadow: 0 30px 80px rgba(0,0,0,0.45); text-align: center; animation: cardIn 0.9s ease forwards, cardPop 0.6s ease-out; z-index: 2; position: relative; }
h1 { font-family: 'Playfair Display', serif; font-size: 28px; color: #ffd6e8; }
.name { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 600; margin-bottom: 18px; }
.divider { width: 60px; height: 2px; background: linear-gradient(90deg, transparent, #ffd6e8, transparent); margin: 18px auto; }

.photos { display: flex; justify-content: center; gap: 14px; margin: 22px 0 10px; }
.photo-item { display: flex; flex-direction: column; align-items: center; }
.photos img { width: 90px; height: 120px; object-fit: cover; border-radius: 14px; box-shadow: 0 12px 30px rgba(0,0,0,0.45); cursor: pointer; animation: floatPhoto 5s ease-in-out infinite, photoPop 0.6s ease-out forwards; }
.photo-item .caption { margin-top:6px;font-size:12px;color:#ffd6e8;text-align:center;opacity:0;transform:translateY(10px);font-family:'Playfair Display',serif;transition:all 0.4s ease;}
.screen#main.active .photo-item .caption{animation:captionFadeIn 1s forwards;}
.photo-item:hover .caption {opacity:1; transform:translateY(-2px);}
.photos { display: flex; overflow-x:auto; gap:14px; scroll-behavior: smooth; padding-bottom:10px; }
.photo-item { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; min-width:90px; transition: transform 0.3s; }
.photos img { width:90px; height:120px; object-fit:cover; border-radius:14px; cursor:pointer; transition: transform 0.3s; }
.arrow { position:absolute; top:50%; transform:translateY(-50%); font-size:50px; color:#ffd6e8; background:rgba(0,0,0,0.3); border-radius:50%; width:60px; height:60px; display:flex; justify-content:center; align-items:center; cursor:pointer; z-index:1000; }
.arrow.left{left:20px;}
.arrow.right{right:20px;}
.arrow:hover{background:rgba(0,0,0,0.6);}

.heart{font-size:26px;margin-top:10px;animation:beat 1.4s infinite;}
audio{margin-top:20px;width:100%;}
.footer{font-size:13px;margin-top:18px;opacity:0.85;}

.particles{position:fixed;inset:0;pointer-events:none;z-index:1;}
.particles span{position:absolute;bottom:-20px;width:6px;height:6px;background:rgba(255,255,255,0.6);border-radius:50%;animation:floatParticle linear infinite;}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden;}

.love-container{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;pointer-events:none;z-index:9999;}
.love{font-size:40px;position:absolute;animation:floatLove 2s ease forwards;opacity:0;}
@keyframes floatLove{0%{transform:translateY(0) scale(0.5);opacity:1;}100%{transform:translateY(-200px) scale(1.5);opacity:0;}}

.arrow { position: absolute; top: 50%; transform: translateY(-50%); font-size: 50px; color: #ffd6e8; background: rgba(0,0,0,0.3); border-radius: 50%; width: 60px; height: 60px; display:flex; justify-content:center; align-items:center; cursor:pointer; user-select:none; z-index:10000; }
.arrow.left{left:20px;}
.arrow.right{right:20px;}
.arrow:hover{background:rgba(0,0,0,0.6);}

img.smooth{transition: transform 0.4s ease;}


@keyframes fadeIn{from{opacity:0;transform:translateY(25px);}to{opacity:1;transform:translateY(0);}}
@keyframes zoomIn{from{opacity:0;transform:scale(0.85);}to{opacity:1;transform:scale(1);}}
@keyframes beat{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-15px);}}
@keyframes floatPhoto{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(0.95);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes cardPop{0%{transform:scale(0.7);opacity:0;}60%{transform:scale(1.1);opacity:1;}100%{transform:scale(1);}}
@keyframes photoPop{0%{transform:scale(0.7);opacity:0;}60%{transform:scale(1.1);opacity:1;}100%{transform:scale(1);}}
@keyframes floatParticle{0%{transform:translateY(0);opacity:0.4;}50%{opacity:0.9;}100%{transform:translateY(-60px);opacity:0;}}
</style>
</head>
<body>

<div class="screen active" id="gift">
  <div onclick="goChallenge()">
    <div class="gift-box">🎁</div>
    <p>Tap kadonya dulu ya…</p>
  </div>
</div>

<div class="screen" id="challenge">
  <div class="challenge">
    <h2>Tantangan kecil 🤍</h2>
    <p>Masukin tanggal lahir kamu dulu ya (DD/MM/YYYY)</p>
    <input type="text" id="code" placeholder="contoh: 29/12/2008">
    <button onclick="checkCode()">Masuk</button>
    <div class="error" id="error">Hehe, salah 🤍 coba lagi ya</div>
  </div>
</div>

<div class="screen" id="main">
  <div class="card">
    <h1>Happy Birthday 🎂</h1>
    <div class="name">[Rizqita Mumtaz]</div>
    <div class="divider"></div>

    <div class="photos">
      <div class="photo-item"><img src="foto1.jpeg"><div class="caption">wih anak gunung banget nih</div></div>
      <div class="photo-item"><img src="foto2.jpeg"><div class="caption">eh ada teteh cantik</div></div>
      <div class="photo-item"><img src="foto3.jpeg"><div class="caption">siap teteh OSIS wkwk</div></div>
    </div>

    <p id="typing"></p>
    <div class="heart">🤍</div>

    <audio controls autoplay loop>
      <source src="aboutyou.MP3" type="audio/mpeg">
    </audio>

    <div class="footer">Dari aku, yang selalu mikirin kamu.</div>
  </div>
</div>

<div class="particles"></div>
<div class="confetti"></div>
<div class="love-container"></div>

<script>
window.onload=function(){
  const photos = [
  { src: 'foto1.jpeg', caption: 'wih anak gunung  banget nih' },
  { src: 'foto2.jpeg', caption: 'eh ada teteh cantik' },
  { src: 'foto3.jpeg', caption: 'siap teteh OSIS wkwk' }
];

document.querySelectorAll('.photos img').forEach((img, i) => {
  img.style.cursor = 'pointer';
  img.onclick = () => openPhoto(i);
});

function openPhoto(index) {
  const overlay = document.createElement('div');
  overlay.style.position = 'fixed';
  overlay.style.inset = '0';
  overlay.style.background = 'rgba(0,0,0,0.85)';
  overlay.style.display = 'flex';
  overlay.style.justifyContent = 'center';
  overlay.style.alignItems = 'center';
  overlay.style.zIndex = 9999;
  overlay.style.flexDirection = 'column';

  // Foto
  const bigImg = document.createElement('img');
  bigImg.src = photos[index].src;
  bigImg.style.maxWidth = '80%';      // biar ga ngezoom
  bigImg.style.maxHeight = '80%';     // biar proporsional
  bigImg.style.objectFit = 'contain'; // fix proporsional
  bigImg.style.borderRadius = '18px';
  bigImg.style.boxShadow = '0 20px 50px rgba(0,0,0,0.6)';

  // Caption
  const captionEl = document.createElement('div');
  captionEl.textContent = photos[index].caption;
  captionEl.style.color = '#ffd6e8';
  captionEl.style.marginTop = '10px';
  captionEl.style.fontFamily = "'Playfair Display', serif";
  captionEl.style.fontSize = '14px';
  captionEl.style.textAlign = 'center';

  overlay.appendChild(bigImg);
  overlay.appendChild(captionEl);

  // Close overlay klik background
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.remove();
  });

  document.body.appendChild(overlay);
}


function goChallenge(){
  document.getElementById('gift').classList.remove('active');
  document.getElementById('challenge').classList.add('active');
}

function checkCode(){
  const code=document.getElementById('code').value.trim();
  if(code==='29/12/2008'){
    showLoveAnimation();
  }else{
    document.getElementById('error').style.display='block';
  }
}

function showLoveAnimation(){
  const container = document.querySelector('.love-container');
  container.innerHTML = ''; // bersihin dulu
  const total = 40; // jumlah love

  for(let i=0;i<total;i++){
    const heart = document.createElement('div');
    heart.className = 'love';
    heart.textContent = '❤️';
    heart.style.left = Math.random()*100 + '%';
    heart.style.fontSize = (20 + Math.random()*20) + 'px';
    heart.style.animationDuration = (2 + Math.random()*2) + 's';
    heart.style.animationDelay = (Math.random()*0.5) + 's';
    heart.style.transform = `translateY(${Math.random()*50}px)`; // sedikit variasi awal
    container.appendChild(heart);

    // animasi jatuh acak dengan keyframes
    heart.animate([
      { transform: `translateY(0px) scale(0.5)`, opacity: 0.8 },
      { transform: `translateY(-150px) scale(1.2)`, opacity: 1 },
      { transform: `translateY(-300px) scale(1)`, opacity: 0 }
    ], {
      duration: 2000 + Math.random()*1000,
      iterations: 1,
      easing: 'ease-out',
      delay: Math.random()*200
    });

    setTimeout(() => heart.remove(), 2500);
  }

  // setelah animasi selesai, masuk halaman utama
  setTimeout(()=>{
    document.getElementById('challenge').classList.remove('active');
    document.getElementById('main').classList.add('active');
    startTyping();
    launchConfettiRain();
  },2600);
  const photosContainer = document.querySelector('.photos');
const photoItems = document.querySelectorAll('.photo-item');
let currentIndex = 0;

document.querySelector('.arrow.left').onclick = () => {
  currentIndex--; 
  if(currentIndex < 0) currentIndex = photoItems.length - 1;
  const scrollPos = photoItems[currentIndex].offsetLeft;
  photosContainer.scrollTo({ left: scrollPos, behavior: 'smooth' });
};

document.querySelector('.arrow.right').onclick = () => {
  currentIndex++; 
  if(currentIndex >= photoItems.length) currentIndex = 0;
  const scrollPos = photoItems[currentIndex].offsetLeft;
  photosContainer.scrollTo({ left: scrollPos, behavior: 'smooth' });
};

}


const text="HAII MAKASIH UDAH BUKA KADO NYA, AKU MAU NGUCAPIN.\nSelamat ulang tahun yaa untuk dirimuu 🤍.\nSemoga dengan ini kamu bisa senang dan bahagia.\naku ucapin selamat sekali lagi panjang umur & sehat selalu.\nHappy birthday! 🎉.\nSemoga di umur baru ini semua hal-hal seru dan menyenangkan datang ke hidupmu.\nSemoga selalu sehat, bahagia, dan makin banyak pengalaman keren.\nTerima kasih udah jadi orang yang asik banget buat diajak ngobrol dan mabar.\nSemoga hari ini spesial banget buat kamu, dan semoga kita masih bisa ketemu 😄✨.\nKu ucapkan Terima kasih sudah hadir dalam hidupku.\nAku senang kok ngabisin waktu sama kamu.\nAku harap kamu juga seneng.\nTerima kasih banyak buat semuanya, I Hope You Like It✨";
const typingEl=document.getElementById('typing'); let index=0;
function startTyping(){ if(!typingEl) return; typingEl.innerHTML=''; index=0; typeEffect(); }
function typeEffect(){ if(index<text.length){ typingEl.innerHTML+=text[index]==='\n'?'<br>':text[index]; index++; setTimeout(typeEffect,45); } }

const particles=document.querySelector('.particles');
for(let i=0;i<18;i++){ const p=document.createElement('span'); p.style.left=Math.random()*100+'%'; p.style.animationDuration=4+Math.random()*4+'s'; p.style.animationDelay=Math.random()*2+'s'; particles.appendChild(p); }

function launchConfettiRain(){
  const confettiContainer=document.querySelector('.confetti'); confettiContainer.innerHTML='';
  for(let i=0;i<100;i++){
    const c=document.createElement('span');
    c.style.left=Math.random()*100+'%';
    const size=4+Math.random()*6;
    c.style.width=size+'px';
    c.style.height=size+'px';
    c.style.backgroundColor=['#ff9a9e','#fad0c4','#a18cd1','#fbc2eb','#ffe3e3','#ffc0cb'][Math.floor(Math.random()*6)];
    c.style.animationDuration=(3+Math.random()*3)+'s';
    c.style.animationDelay=Math.random()*2+'s';
    confettiContainer.appendChild(c);
  }
}

window.goChallenge=goChallenge;
window.checkCode=checkCode;
};
</script>

</body>
</html>
